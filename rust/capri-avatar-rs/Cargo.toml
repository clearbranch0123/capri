[package]
name = "capri-avatar-rs"
version = "3.8.1"
edition = "2021"
description = "Experimental native Rust Wayland zwlr_layer_shell_v1 2D avatar daemon for Capri"
license = "MIT"
publish = false

[dependencies]
fontdue = "0.9"
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["xkbcommon"] }
tiny-skia = "0.11"
wayland-client = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
