[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capri"
version = "3.7.3"
description = "Cyberpunk AI Companion for Linux (Niri & Hyprland Wayland / Arch / CachyOS / Fedora)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "D" }
]
keywords = ["cyberpunk", "ai", "assistant", "companion", "niri", "wayland", "vosk", "whisper", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: Window Managers",
]

dependencies = [
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "openai>=1.20.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyside6>=6.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
voice = [
    "edge-tts>=6.1.0",
    "elevenlabs>=1.0.0",
    "evdev>=1.7.0",
    "fish-audio-sdk>=1.0.0",
    "sounddevice>=0.4.6",
]
local-stt = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
]
vision = [
    "google-genai>=0.1.0",
]
web = [
    "duckduckgo-search>=6.0.0",
]
all = [
    "duckduckgo-search>=6.0.0",
    "edge-tts>=6.1.0",
    "elevenlabs>=1.0.0",
    "evdev>=1.7.0",
    "faster-whisper>=1.0.0",
    "fish-audio-sdk>=1.0.0",
    "google-genai>=0.1.0",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/clearbranch0123/capri"
Repository = "https://github.com/clearbranch0123/capri"
Issues = "https://github.com/clearbranch0123/capri/issues"

[project.scripts]
capri = "capri.cli:cli_main"
capri-deck = "capri.ui.cyberdeck:launch_cyberdeck"
capri-avatar = "capri.ui.overlay:launch_avatar"

[tool.setuptools.packages.find]
where = ["."]
include = ["capri*"]

[tool.setuptools.package-data]
"capri" = [
    "*.md",
    "assets/ui_click.wav",
    "assets/ui_glitch.wav",
    "assets/wake_chirp.wav",
    "assets/avatar.png",
    "assets/chip.png",
    "assets/chip-source.png",
    "assets/capri_face_*.png",
    "assets/capri_reset_*.png",
    "assets/capri_voice_clean.wav",
    "assets/capri_voice_reference.wav",
    "assets/capri-cyberdeck.desktop",
    "assets/sprites/*",
    "assets/sprites_v2/*",
    "assets/3d/qml/*",
    "assets/3d/qml/maps/*",
    "assets/3d/qml/meshes/*",
    "assets/3d/textures/*",
]
