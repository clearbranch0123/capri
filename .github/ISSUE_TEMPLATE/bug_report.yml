name: Bug Report
description: Report a bug in Capri Open Beta (with safe redacted diagnostics)
title: "[Bug]: "
labels: ["bug", "open-beta"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing **Capri Open Beta**!
        **Privacy reminder:** NEVER paste API keys, `.env` contents, or personal chat history into public issues.
        Use `capri --bugreport` (or `/bugreport` in Cyberdeck) to generate a safely redacted diagnostic bundle.

  - type: input
    id: version
    attributes:
      label: Capri Version
      description: Output of `capri --version`
      placeholder: "3.1.0"
    validations:
      required: true

  - type: dropdown
    id: distro
    attributes:
      label: Linux Distribution
      options:
        - Arch Linux
        - CachyOS
        - Fedora
        - Other Linux (best-effort)
    validations:
      required: true

  - type: dropdown
    id: compositor
    attributes:
      label: Window Manager / Compositor
      options:
        - Niri (Wayland)
        - Hyprland (Wayland)
        - Other Wayland
        - X11 / Headless
    validations:
      required: true

  - type: dropdown
    id: policy
    attributes:
      label: Tool Policy Mode
      options:
        - ask (default)
        - safe
        - trusted
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `./run.sh --gui`
        2. Execute `/mcp connect` or ...
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: bugreport
    attributes:
      label: Redacted Diagnostics (`capri --bugreport` or `capri --doctor`)
      description: Paste the contents of the file generated by `capri --bugreport`. Confirm no secrets are included.
      render: markdown
    validations:
      required: false
