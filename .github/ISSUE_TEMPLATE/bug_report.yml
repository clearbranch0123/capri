name: Bug Report
description: Report a bug in Capri Open Beta (with safe redacted diagnostics)
title: "[Bug]: "
labels: ["bug", "open-beta"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing **Capri Open Beta**!
        **Privacy reminder:** NEVER paste API keys, `.env` contents, or personal chat history into public issues.
        Use `capri --bugreport` (or `/bugreport` in Cyberdeck) to generate a safely redacted diagnostic bundle, and double-check it before posting.

  - type: input
    id: version
    attributes:
      label: Capri Version
      description: Output of `capri --version`
      placeholder: "3.8.1"
    validations:
      required: true

  - type: dropdown
    id: distro
    attributes:
      label: Linux Distribution
      options:
        - Arch Linux
        - CachyOS
        - Fedora
        - Other Linux (best-effort)
    validations:
      required: true

  - type: dropdown
    id: compositor
    attributes:
      label: Window Manager / Compositor
      options:
        - Niri (Wayland)
        - Hyprland (Wayland)
        - Sway / Other wlroots (Wayland)
        - Other Wayland
        - X11 / Headless
    validations:
      required: true

  - type: input
    id: compositor_version
    attributes:
      label: Compositor Version & Shell
      description: Output of `hyprctl version` or `niri --version` (plus shell/bar preset if any, e.g. end-4 / quickshell / waybar)
      placeholder: "Hyprland 0.57.2 (end-4 / quickshell) or Niri 25.05"
    validations:
      required: true

  - type: dropdown
    id: avatar_backend
    attributes:
      label: Avatar Backend
      options:
        - python (default)
        - rust (capri-avatar-rs)
        - disabled / N/A
    validations:
      required: true

  - type: dropdown
    id: policy
    attributes:
      label: Tool Policy Mode
      options:
        - ask (default)
        - safe
        - trusted
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `./run.sh --gui` (or `capri-deck --ask`)
        2. Switch workspace / resize Quick Ask / open avatar HUD / ...
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: bugreport
    attributes:
      label: Redacted Diagnostics (`capri --bugreport` or `capri --doctor`)
      description: Attach diagnostics ONLY after verifying they contain no secrets, tokens, or private paths.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: secret_check
    attributes:
      label: Privacy & Secret Check
      options:
        - label: I verified that any pasted diagnostics or logs contain no API keys, tokens, `.env` values, or personal chat history.
          required: true
