name: Feature Request
description: Suggest an improvement, integration, or new capability for Capri
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Goal
      description: What workflow or pain point would this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working in Cyberdeck, Quick Ask, CLI, or the Wayland avatar.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Target Environment
      options:
        - Niri (Wayland)
        - Hyprland (Wayland)
        - Sway / Other wlroots
        - KDE Plasma / GNOME (Wayland)
        - Cross-compositor / CLI
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Optional mockups, references, or trade-offs.
    validations:
      required: false
