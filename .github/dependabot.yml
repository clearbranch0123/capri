version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # Keep minimum `>=` floors compatible with Arch/Fedora system packages;
    # only open a PR when a constraint genuinely requires bumping.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
