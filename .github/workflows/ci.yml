name: Capri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt / Audio system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon0 \
            libportaudio2

      - name: Install Capri with full and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]" build setuptools wheel

      - name: Run full pytest suite (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q

      - name: Build and audit release artifacts
        run: |
          ./scripts/build_beta_release.sh
          cd dist && sha256sum -c SHA256SUMS.txt

  rust-avatar-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/capri-avatar-rs/target/
          key: ${{ runner.os }}-cargo-avatar-rs-${{ hashFiles('rust/capri-avatar-rs/Cargo.lock') }}

      - name: Install Wayland / xkbcommon dev headers and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev python3-pytest

      - name: Run Rust avatar unit tests
        run: cargo test --locked --manifest-path rust/capri-avatar-rs/Cargo.toml

      - name: Run Rust clippy strict audit
        run: cargo clippy --locked --all-targets --manifest-path rust/capri-avatar-rs/Cargo.toml -- -D warnings

      - name: Build Rust avatar binary and run Python -> Rust E2E IPC test
        env:
          CAPRI_REQUIRE_RUST_AVATAR_E2E: "1"
          CAPRI_ASSERT_NO_QT: "1"
          PYTHONPATH: "."
        run: |
          cargo build --locked --manifest-path rust/capri-avatar-rs/Cargo.toml
          pytest --noconftest -o addopts="" tests/test_rust_avatar_e2e_ipc.py -v
