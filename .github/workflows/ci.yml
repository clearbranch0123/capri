name: Capri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt / Audio system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxkbcommon0 \
            libportaudio2

      - name: Install Capri with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build setuptools wheel

      - name: Run full pytest suite (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q

      - name: Build and audit release artifacts
        run: |
          ./scripts/build_beta_release.sh
          cd dist && sha256sum -c SHA256SUMS.txt
